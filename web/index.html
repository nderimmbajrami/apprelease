<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AppRelease console — build, sign and publish Flutter apps to Google Play and the App Store.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121210">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAF7">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AppRelease">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AppRelease</title>
  <link rel="manifest" href="manifest.json">

  <!-- The engine asks for the fonts only once it runs; fetched now, they are
       already here by then. -->
  <link rel="preload" href="assets/assets/fonts/Inter-400.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-500.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-600.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-700.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/JetBrainsMono-400.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/JetBrainsMono-600.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="font" type="font/otf" crossorigin>
  <!--WASM_PRELOAD: build_web.sh puts the stamped wasm files here, for the
      browsers that will use them. -->

  <!-- The app itself arrives in a few seconds on a cold start. Until its
       first frame, this is the screen: the same mark and progress bar the
       app then draws, on the same background, so nothing jumps. -->
  <style>
    :root { --bg: #121210; --ink: #ECECE7; --tile: #1E1E1B; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #FAFAF7; --ink: #111111; --tile: #111111; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; z-index: 10; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); transition: opacity .25s ease; -webkit-font-smoothing: antialiased;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .mark {
      width: 48px; height: 48px; border-radius: 11px; background: var(--tile);
      display: flex; align-items: center; justify-content: center;
    }
    #splash .mark svg { width: 30px; height: 30px; }
    #splash .name { margin-top: 16px; font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
    #splash .name span { opacity: .5; font-weight: 500; }
    #splash .bar {
      margin-top: 24px; width: 160px; height: 3px; border-radius: 2px; overflow: hidden;
      background: color-mix(in srgb, var(--ink) 8%, transparent);
    }
    #splash .bar i {
      display: block; height: 100%; width: 40%; border-radius: 2px;
      background: color-mix(in srgb, var(--ink) 60%, transparent);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading AppRelease">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
      </svg>
    </div>
    <div class="name">apprelease<span>.store</span></div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    // Flutter fires this once it has drawn; the splash fades under it.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

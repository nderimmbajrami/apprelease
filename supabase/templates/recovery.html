<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Reset your password</title></head>
<body style="margin:0;padding:0;background:#f4f4f1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#111;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f1;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#fff;border:1px solid #e3e3de;border-radius:12px;">
        <tr><td style="padding:28px 32px 0;font-size:15px;font-weight:700;letter-spacing:-.2px;">AppRelease</td></tr>
        <tr><td style="padding:20px 32px 0;font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1.25;">Reset your password</td></tr>
        <tr><td style="padding:12px 32px 0;font-size:15px;line-height:1.55;color:#444;">Enter this code in AppRelease to choose a new password.</td></tr>
        <tr><td style="padding:22px 32px 0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#777;">Your code</td></tr>
        <tr><td style="padding:8px 32px 0;"><div style="display:inline-block;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:30px;font-weight:600;letter-spacing:.35em;padding:14px 20px 14px 24px;border:1px solid #e3e3de;border-radius:10px;background:#fafaf7;">{{ .Token }}</div></td></tr>
        <tr><td style="padding:18px 32px 0;font-size:14px;line-height:1.55;color:#444;">The code is valid for one hour. If you did not ask for a reset, your password stays as it is.</td></tr>
        <tr><td style="padding:24px 32px 28px;font-size:12px;line-height:1.5;color:#888;border-top:1px solid #eeeeea;margin-top:20px;">Sent to {{ .Email }} by AppRelease &middot; <a href="https://apprelease.store" style="color:#888;">apprelease.store</a></td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
